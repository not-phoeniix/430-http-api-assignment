<!DOCTYPE html>
<html lang="en">

<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script>
    // convert an in string in XML format to a javascript object
    function parseXml(inStr) {
      const parsed = new window.DOMParser().parseFromString(inStr, "text/xml");
      return {
        message: parsed.querySelector("message").textContent,
        id: parsed.querySelector("id")?.textContent
      }
    }

    // convert an in string in a JSON format to a javascript object
    function parseJson(inStr) {
      return JSON.parse(inStr);
    }

    function handleData(res, parsedData) {
      document.querySelector("#content").innerHTML = `
        <p><b>${res.statusText}</b></p>
        <p><b>ID:</b> ${parsedData.id}</p>
        <p>Message: <em>${parsedData.message}</em></p>
      `;
    }

    async function sendFetch(url) {
      console.log(`fetching from URL: ${url}`);

      const type = document.querySelector("#type").value;

      const res = await fetch(url, {
        method: "GET",
        headers: {
          accept: type
        }
      });

      const txt = await res.text();
      console.log(txt);

      let parsedData;

      const contentType = res.headers.get("Content-Type");
      switch (contentType) {
        case "application/json":
          parsedData = parseJson(txt);
          break;
        case "text/xml":
          parsedData = parseXml(txt);
          break;
        default:
          console.warn(`WARNING: content type "${contentType}" not supported!`);
          break;
      }

      // dont handle data if the data was never parsed in the first place
      if (!parsedData) {
        return;
      }

      handleData(res, parsedData);
    }

    function init() {
      const page = document.querySelector("#page");
      const sendButton = document.querySelector("#send");
      const pageSelect = document.querySelector("#page");

      sendButton.addEventListener("click", () => sendFetch(pageSelect.value));
    }

    document.addEventListener("DOMContentLoaded", init);

  </script>
</head>

<body>
  <section id="top">
    <h3>Status Code Tests</h3>
    <select id="page">
      <option value="/success">Success</option>
      <option value="/badRequest">Bad Request</option>
      <option value="/badRequest?valid=true">Bad Request Valid=true</option>
      <option value="/unauthorized">Unauthorized</option>
      <option value="/forbidden">Forbidden</option>
      <option value="/internal">Internal</option>
      <option value="/notImplemented">Not Implemented</option>
      <option value="/notFound">Not Found</option>
    </select>
    <select id="type">
      <option value="application/json">JSON</option>
      <option value="text/xml">XML</option>
    </select>
    <button id="send">Send</button>
  </section>
  <section id="content">
  </section>
</body>

</html>
